<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>예제 3-7. <input> 태그의 속성</title>
    </head>
    <body>
        <form>
            이름 : <input type="text" value="홍길동"><br>
            닉네임 : <input type="text" autofocus><br>
            아이디 : <input type="text" value="hong" readonly><br>
            레벨 : <input type="text" value="9" disabled><br>
            전화번호 : <input type="text" placeholder="010-123-1234">
        </form>
    </body>
</html>
