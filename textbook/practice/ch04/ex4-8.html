<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>예제 4-8. text-align 속성으로 글자 정렬하기</title>
    </head>
    <body>
        <h3>글자 정렬</h3>
        <h3 style="text-align: left;">글자 정렬</h3>
        <h3 style="text-align: center;">글자 정렬</h3>
        <h3 style="text-align: right;">글자 정렬</h3>
    </body>
</html>
