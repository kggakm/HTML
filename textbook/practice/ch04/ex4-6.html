<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>예제 4-6. font-family 속성으로 글꼴 설정하기</title>
    </head>
    <body>
        <h3>글꼴 설정</h3>
        <p>
            <span style="font-family:'돋움';">안녕하세요</span><br>
            <span style="font-family:'굴림';">안녕하세요</span><br>
            <span style="font-family:'맑은고딕';">안녕하세요</span><br>
            <span style="font-family:'바탕';">안녕하세요</span>
        </p>
    </body>
</html>
