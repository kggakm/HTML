<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>예제 4-5. font-size 속성으로 글자 크기 설정하기</title>
    </head>
    <body>
        <h3>글자 크기 설정</h3>
        <p>
            <span>글자 크기(기본)</span><br>
            <span style="font-size:16px;">글자 크기(16px)</span><br>
            <span style="font-size:20px;">글자 크기(20px)</span><br>
            <span style="font-size:24px;">글자 크기(24px)</span><br>
        </p>
    </body>
</html>
