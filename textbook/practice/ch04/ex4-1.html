<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>예제 4-1. CSS의 기본 구조</title>
        <style>
            h2 {
                font-family: "돋움";
                color: red;
            }
            p {
                font-size: 20px;
                color: blue;
            }
        </style>
    </head>
    <body>
        <h2>기타</h2>
        <p>기타는 현을 튕겨 소리를 내는 악기로, 프랑스 지방에서 유래하였다. 머리,
            목, 몸체로 구성되어 있으며, 목 부분에는 20여 개의 프렛으로 구성된다.</p>
    </body>
</html>
