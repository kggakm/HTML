<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<script>
let n = 1;          // 시작 값
let sum = 0;        // 합계를 저장할 변수

while (n <= 10) {   // n이 10 이하인 동안 반복
    sum = sum + n;  // sum에 n을 더함
    n++;            // n을 1씩 증가
}

console.log("1에서 10까지의 합:", sum);  // 결과 출력
</script>
</body>
</html>
