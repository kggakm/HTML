<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<button onclick="toggleBg()">배경색 변경</button>

<script>
function toggleBg() {
    if (document.body.style.backgroundColor == "blue") {
        document.body.style.backgroundColor = "green";
    } else {
        document.body.style.backgroundColor = "blue";
    }
}
</script>
</body>
</html>
