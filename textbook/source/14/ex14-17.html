<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<h3>강아지 갤러리</h3>
<button onclick="showImages()">이미지 출력</button>
<div id="gallery"></div>

<script>
function showImages() {
    let html = "";       // 이미지 태그를 쌓아 둘 문자열
    let count = 0;       // 출력한 이미지 개수

    while (count < 5) {  // 5장이 될 때까지 반복
        html += "<img src='img/dog.png' alt='강아지'>";
        count++;         // count 값을 1씩 증가
    }

    document.getElementById("gallery").innerHTML = html; // 완성된 HTML을 한 번에 출력
}
</script>
</body>
</html>
