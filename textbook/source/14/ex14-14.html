<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<script>
let num = 1;                   // ➊ 초기값 설정

while (num <= 5) {             // ➋ 조건이 참이면 반복 실행
    console.log(num);          // ➌ 현재 num 출력
    num++;                     // ➍ num을 1 증가
}
</script>
</body>
</html>
