<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* 상단 내비게이션 바 */
.nav {
    display: flex;                 /* ➊ 가로 방향으로 로고 + 메뉴 배치 */
    justify-content: space-between;/* ➋ 좌우 끝으로 벌리기 */
    align-items: center;           /* ➌ 세로 가운데 정렬 */
    padding: 12px 16px;
    background-color: green;
    color: #fff;
}
.nav-logo { font-size: 1.2rem; font-weight: bold; }
.nav-menu a { color: #fff; text-decoration: none;
    margin-left: 16px; font-size: 0.95rem;
}
/* 화면 폭이 640px 이하일 때: 세로로 배치 */
@media (max-width: 640px) {
    .nav {
        flex-direction: column;    /* ➎ 로고 아래에 메뉴가 쌓이도록 변경 */
        align-items: flex-start;   /* ➏ 왼쪽 정렬 */
    }
    .nav-menu {
        margin-top: 8px;
    }
}
</style>
</head>
<body>
<header class="nav">
    <div class="nav-logo">로고</div>
    <nav class="nav-menu">
        <a href="#">홈</a>
        <a href="#">소개</a>
        <a href="#">서비스</a>
        <a href="#">문의</a>
    </nav>
</header>
</body>
</html>
