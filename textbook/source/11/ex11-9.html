<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.card-list {
    display: flex;
    flex-wrap: wrap;                     /* 줄바꿈 허용 */
    gap: 20px;
}
/* 기본: 모바일 기준 – 한 줄에 1개 */
.card {
    flex: 0 0 100%;                      /* 가로 너비 100% */
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
}
/* 카드 내용 공통 스타일 */
.card img { width: 100%; display: block; }
.card-body { padding: 12px 16px 16px; }
.card-title { font-size: 16px; margin-bottom: 6px; }
.card-text { font-size: 13px; color: #555; }
/* 768px 이상: 한 줄에 2개 */
@media (min-width: 768px) {
    .card {
        flex: 0 0 calc(50% - 10px);      /* 2개 × 50% - 간격 보정 */
    }
}
/* 1024px 이상: 한 줄에 4개 */
@media (min-width: 1024px) {
    .card {
        flex: 0 0 calc(25% - 15px);      /* 4개 × 25% - 간격 보정 */
    }
}
</style>
</head>
<body>
<div class="container">
    <h2 style="margin-bottom:16px;">추천 여행 상품</h2>

    <div class="card-list">
        <article class="card">
            <img src="img/trip1.jpg" alt="동남아 패키지">
            <div class="card-body">
                <h3 class="card-title">동남아 패키지</h3>
                <p class="card-text">다낭 · 세부 · 푸켓 인기 여행지를 한 번에!</p>
            </div>
        </article>

        <article class="card">
            <img src="img/trip1.jpg" alt="일본 온천 여행">
            <div class="card-body">
                <h3 class="card-title">일본 온천 여행</h3>
                <p class="card-text">따뜻한 노천탕과 미식 여행을 함께 즐겨 보세요.</p>
            </div>
        </article>

        <article class="card">
            <img src="img/trip1.jpg" alt="유럽 자유 여행">
            <div class="card-body">
                <h3 class="card-title">유럽 자유 여행</h3>
                <p class="card-text">도시별 맞춤 일정으로 나만의 유럽을 설계합니다.</p>
            </div>
        </article>

        <article class="card">
            <img src="img/trip1.jpg" alt="국내 힐링 여행">
            <div class="card-body">
                <h3 class="card-title">국내 힐링 여행</h3>
                <p class="card-text">제주, 강릉, 여수로 떠나는 주말 힐링 코스.</p>
            </div>
        </article>
    </div>
</div>
</body>
</html>
