<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 전체 컨테이너 */
.container { max-width: 960px; margin: 0 auto; padding: 16px; }
/* 12열 그리드 행 */
.row {                  
    display: flex;
    flex-wrap: wrap;          /* 줄바꿈 허용 */
}
/* 공통 컬럼 스타일 */
.col { padding: 8px; }
.col-6 { width: 50%; }
.col-12 { width: 100%; }
/* 폼 요소 공통 스타일 */
label {
    display: block;         
    margin-bottom: 4px;
    font-weight: bold;
}
input[type="text"], input[type="email"], textarea {                  
    width: 100%;
    padding: 8px;
    border: 1px solid #cccccc;
    border-radius: 4px;
}
textarea {
    min-height: 120px;
}
/* 작은 화면(640px 이하)에서는 모두 한 줄 전체를 사용 */
@media (max-width: 640px) {
    .col-6 {      
        width: 100%;
    }
}
</style>
</head>
<body>
<div class="container">
    <h2>문의하기</h2>
    <form>
        <div class="row">
            <div class="col col-6">
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="이름을 입력하세요">
            </div>
            <div class="col col-6">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="이메일을 입력하세요">
            </div>
            <div class="col col-12">
                <label for="message">메시지</label>
                <textarea id="message" placeholder="문의 내용을 입력하세요"></textarea>
            </div>
        </div>
    </form>
</div>
</body>
</html>
