<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; }
/* 공통 내비게이션 스타일 */
.nav {
    display: flex;                       /* 로고, 버튼, 메뉴를 가로 한 줄 배치 */
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: blue;
    color: #fff;
}
.nav-logo { font-size: 1.2rem; font-weight: bold; }
/* 메뉴 영역 */
.nav-menu {
    display: flex;                       /* 데스크톱에서는 가로 메뉴 */
}
.nav-menu a { color: #fff; text-decoration: none;
    margin-left: 16px; font-size: 0.95rem;
}
/* 햄버거 버튼 */
.nav-toggle {
    display: none;                       /* 기본(큰 화면)에서는 숨김 */
    background: none;
    border: none;
    color: #fff;
    font-size: 1.4rem;
    cursor: pointer;
}
/* 640px 이하: 모바일 스타일 */
@media (max-width: 640px) {
    .nav {
        flex-wrap: wrap;                 /* 줄바꿈 허용 (버튼 아래로 메뉴 내려갈 수 있게) */
    }
    .nav-menu {
        display: none;                   /* 기본 상태: 메뉴 숨김 */
        width: 100%;
        flex-direction: column;          /* 세로 메뉴 */
        margin-top: 8px;
    }
    .nav-menu a {
        margin: 8px 0;
    }
    .nav-menu.show {                     /* 버튼 클릭 후 나타나는 메뉴 */
        display: flex;
    }
    .nav-toggle {
        display: block;                  /* 모바일에서만 햄버거 버튼 표시 */
        margin-left: auto;
    }
}
</style>
</head>
<body>
<header class="nav">
    <div class="nav-logo">로고</div>
    <!-- 햄버거 버튼 (모바일 전용) -->
    <button class="nav-toggle" aria-label="메뉴 열기">
        ☰
    </button>
    <nav class="nav-menu">
        <a href="#">홈</a>
        <a href="#">소개</a>
        <a href="#">서비스</a>
        <a href="#">문의</a>
    </nav>
</header>
<script>
// 햄버거 버튼 클릭 시 메뉴 보이기/숨기기 토글
const toggleBtn = document.querySelector('.nav-toggle');
const navMenu  = document.querySelector('.nav-menu');

toggleBtn.addEventListener('click', function () {
    navMenu.classList.toggle('show');
});
</script>
</body>
</html>
