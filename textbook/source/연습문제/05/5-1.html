<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
h1 {
    width: 600px;           /* 너비: 600px */
    margin-left: 50px;      /* 좌측 마진: 50px */
	color:orange;       /* 글자 색상: 오렌지색 */
	font-size:60px;         /* 글자 크기: 60px */
	text-align: center;     /* 중앙 정렬 */
	text-shadow:5px 5px 8px #666666;    /* 글자 그림자 */
}
h2 {
    margin: 20px 0 0 50px;      /* 상단 마진:20px, 좌측 마진: 50px */
	color:green;        /* 글자 색상: 초록색 */
	text-decoration: underline;     /* 밑줄 그리기 */
}
h3 {
    margin-left: 50px;      /* 좌측 마진: 50px */
	font-style: italic;     /* 이탤릭체 */
}
p {
    margin: 30px 0 0 50px;      /* 상단 마진:30px, 좌측 마진: 50px */
    width: 600px;               /* 너비: 600px */
    border: solid 1px #cccccc;  /* 경계선: 실선 1px #cccccc */
    padding: 20px;          /* 패딩: 20px */
	line-height:150%;       /* 줄간격 : 150% */
}
</style>
</head>
<body>
<h1>Botanic Garden</h1>
<h2>꿈속의 정원 우리 식물원</h2>
<h3>우리 식물원은 안락과 건강을 선사합니다.</h3>
<p> 우리 식물원은 인간이 자연과 더불어 사는 삶의 가치를 깨닫게 하며, 평소에 꿈꿔왔던 것을 정원에 실현하려는 노력을 기울이고 있습니다. 각박한 삶 속에서 자연의 소중함을 일깨워주고 마음의 평온과 건강한 쉼을 제공할 것입니다.</p>
</body>
</html>
