<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>직원 채용</title>
<style>
body {
    font-family:"바탕";     /* 글꼴 */
    color:#444444;          /* 글자 색상 */
}
div {
    width: 800px;           /* 박스 너비 */
    border: solid 1px #cccccc;  /* 경계선 */
    box-shadow: 10px 10px 20px #aaaaaa; /* 박스 그림자 */
    padding: 20px;          /* 패딩 */
}
h3 {
    border-bottom: solid 1px #dddddd;   /* 하단 경계선 */
    padding-bottom: 5px;      /* 하단 패딩 */
}
p {
    margin-left: 20px;      /* 좌측 마진 */
}
li {
    margin-top: 10px;       /* 상단 마진 */
}
span {
    color:#ff0000;         /* 글자 색상: 빨간색 */
    font-weight:bold;         /* 볼드체 */
}
</style>
</head>
<body>
    <h1>직원 채용</h1>
    <div>
        <h3>채용 인원 : 00명</h3>	
        <h3>지원 자격</h3>
        <ul>
            <li><span>학력 제한 없음</span></li>
            <li>남자에 한하여 병역을 필하거나 면제받은 분</li>
            <li>해외여행 및 신원보증에 결격사유가 없는 분</li>
            <li>외국어 능통자 및 관련 자격증 소지자 우대</li>
        </ul>
        <p>※ 당사는 전형 과정 중 성별, 연령에 차별을 두지 않습니다.</p>
        <h3>지원 서류</h3>
        <ol>
            <li>이력서(양식을 다운로드하여 사용)</li>
            <li>자기소개서(별도의 양식 없음)</li>
            <li>주민등록등본</li>
        </ol>
    </div>
</body>
</html>
