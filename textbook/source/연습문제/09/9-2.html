<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0;  padding: 0;  
    box-sizing: border-box;             /* box-sizing 설정 */
}
.box { width: 1100px;  
    margin: 0 auto;                     /* 박스 중앙 배치 */
}
li { list-style-type: none;  }
footer { height: 260px;	 
    background-color: green;          /* 배경 색상 설정 */
    color: white; 
}
#bottom_menu ul { padding: 20px 0 0 80px;  font-weight: bold; }
#bottom_menu li { 
    display: inline;	
    margin-right: 30px;                 /* display 속성 인라인 설정 */
}
footer .items {	float: left;            /* 부유 요소로 좌측 배치 */
    margin: 40px 0 0 80px; 
}
footer h3 {  color:yellow;  }
footer .items ul {  margin-top: 15px;  }
footer .items li {	margin-top: 5px;  }
footer .phone {	font-size: 25px;  font-weight: bold; }
</style>
</head>

			</nav>

			</div> <!-- items -->
			<div class="items">

					<li>주소 : 경기도 수원시 권선로 123</li>

					<li>팩스 : 031-123-1234</li>
					<li>이메일 : woori@korea.com</li>
				</ul>
			</div> <!-- items -->
			<div class="items">
				<h3>입금 정보</h3>
				<ul>
					<li>국민 123-123-123456</li>
					<li>우리 인테리어</li>

</body>
</html>
