<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.banner {
    display: flex;
    justify-content: center;      /* 가로 방향 가운데 정렬 */
    align-items: center;      /* 세로 방향 가운데 정렬 */
    height: 300px;
    background: #eeeeee;
}
.banner .text {
    padding: 20px;
    background: white;
    border: 1px solid #dddddd;
}
</style>
<body>
    <div class="banner">
        <div class="text">
            <h2>여름 특가 세일</h2>
            <p>지금 예약하면 최대 50% 할인!</p>
        </div>
    </div>
</body>
</html>
