<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* {                                /* 전체 선택자 */
	margin: 0;
	padding: 0;
}
h3 { padding: 20px; }              /* 요소 선택자 */
img { width: 500px; }		       /* 요소 선택자 */
div {							   /* 요소 선택자 */
	width: 500px;
	border: solid 1px gray;     
	margin: 20px;        
}
p {									/* 요소 선택자 */
	padding: 20px;           
	line-height: 180%;         
}
</style>
</head>
<body>
	<div>
		<h3>고양이</h3>
		<img src="img/cat1.jpg">
		<p>머리가 둥글고 얼굴은 짧고 넓으며, 눈이 둥글고 눈의 기능이 뛰어나다. 귓바퀴는 작은 삼각형 모양으로 
		끝에 긴 털이 있으며 몸에는 다양한 무늬가 있다.</p>
	</div>
</body>
</html>
