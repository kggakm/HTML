<body>
    <h1>열대어 종류</h1>
    <dl>
        <dt>- 네온 테트라</dt>
        <dd>네온테트라는 매우 인기있는 열대어로 정도로 쉽게 찾아볼 수 있는 열대어의 종류이다. 
            몸에서 반짝반짝하는 네온 빛을 뿜어내는 덕분에 인기가 많다.</dd>
        <dt>- 구피</dt>
        <dd>가장 흔한 열대어로써 사육 난이도가 가장 쉽다고 알려져 있는 만큼 비교적 온순하고 
            순한 성격을 가지고 있다. 주변 환경에 잘 적응하며 번식력도 뛰어나서 많은 사람들이 좋아한다.</dd>
    </dl>
</body>
</html>
