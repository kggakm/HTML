    <h2>블루탱</h2>

    <p>몸길이 30cm 내외까지 자란다. 등지느러미 극조는 9개, 연조는 19~20개, 뒷지느러미 극조는 3개,

        깨끗하고 조류가 강한 산호초 지역 수심 2~40m에 산다.</p>
