<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* {
	margin: 0;										/* 마진 초기화 */
	padding: 0;										/* 패딩 초기화 */
}
#hair {
	width: 600px;									/* 너비 */
	height: 855px;									/* 높이 */
	margin: 30px;									/* 마진 */
	background-color: #0fa2bc;		               /* 배경 색상 */
	color: white;									/* 글자 색상 */
	font-size: 18px;								/* 글자 크기 */
	font-family: "돋움";								/* 글자 폰트 */
	text-align: center;								/* 글자 중앙 정렬 */
	box-shadow: 5px 5px 10px #888888;				/* 박스 그림자 */
}
#hair img {
	width: 400px;									/* 너비 */
}
#hair h1 {
	font-family: "맑은고딕";							/* 글자 폰트 */
	font-size: 60px;								/* 글자 크기 */
	color: white;									/* 글자 색상 */
	text-shadow: 3px 3px 10px black;				/* 글자 그림자 */
	padding-top: 20px;								/* 상단 패딩 */
}
#hair .eng {
	display: block;									/* 블록 방식 설정 */
	font-size: 30px;								/* 글자 크기 */
	color: white;									/* 글자 색상 */
	margin: 10px 0;									/* 마진 */
	text-align: center;								/* 글자 중앙 정렬 */
}
#hair p {
	margin: 30px 60px;								/* 마진 */
	line-height: 150%;								/* 줄 간격 */
	text-align: center;								/* 글자 중앙 정렬 */
	color: white;									/* 글자 색상 */
}
#hair ul {
	margin-top: 20px;								/* 상단 마진 */
}
#hair li {
	text-align: left;								/* 글자 좌측 정렬 */
	list-style-type: square;						/* 글 머리 기호 : 사각형 */
	margin-left: 120px;								/* 좌측 마진 */
	padding: 10px 0 0 15px;							/* 패딩 */
	line-height: 150%;								/* 줄 간격 */
}
#hair .button {
	background-color: pink;						/* 배경 색상 */
	padding: 20px;									/* 패딩 */
	margin: 40px 100px;								/* 마진 */							
    color: #444444;                               /* 글자 색상 */
	font-size: 30px;								/* 글자 크기 */
	font-weight: bold;								/* 볼드체 */
}
</style>
</head>
<body>
	<div id="hair">
		<h1>우리 헤어 샵</h1>
		<span class="eng">Woori  Hair Shop</span>
		<p>생일, 결혼기념일, 만난 기념일 등 특별한 날에 스페셜 헤어 서비스를 통해 포토존에서 멋진 추억의 사진을 남겨보세요.</p>
		<img src="img/hairshop.jpg">
		<ul>
		<li>평일 : 10:00 ~ 18:00<br>
	        토요일 : 10:00 ~ 13:00</li>
		<li>장소 : 기념품 판매점 옆 우리 헤어 샵<br>
		※ 크리스마스 맞이 특별 할인!</li>
		</ul>
		<div class="button">
			<a>자세히 보기</a>
		</div>
	</div>
</body>
</html>
