<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
a:link {						/* 링크걸린 글자 */
	color: orange;                /* 글자 오렌지색 */
	text-decoration: none;       /* 밑줄 삭제 */
}
a:visited {                      /* 한번 이상 방문 후 */
	color: orange;                /* 글자 오렌지색 */
	text-decoration: none;       /* 밑줄 삭제 */
}
a:hover {						/* 마우스 롤오버 시 */
	color: red;                /* 글자 빨간색 */
	text-decoration: underline;   /* 밑줄 그리기 */
}
a:active {						/* 마우스 클릭한 순간 */
	color: orange;                /* 글자 오렌지색 */
	text-decoration: none;       /* 밑줄 삭제 */
}
</style>
</head>
<body>
	<h3 style="color: blue">자바스크립트 강좌</h3>
	<ul>
	<li><a href="#">강의 자료실</a></li>
	<li><a href="#">질문과 답변</a></li>
	<li><a href="#">자유 게시판</a></li>
	</ul>
</body>
</html>
