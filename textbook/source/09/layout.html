<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0;  padding: 0; }
.box { width: 1100px;  margin: 0 auto; border: solid 3px red; }
header { height: 100px; border: solid 3px green; }
header, footer, #main_image, #main { text-align: center; font-size: 25px; }
section#main_image {  height: 100px;  border: solid 3px green; }
section#main { height: 100px;  border: solid 3px green;  }
footer { height: 100px;  border: solid 3px green; }
</style>
</head>
<body>
	<header>
        <div class="box">   
			헤더 내용
		</div> <!-- box -->
	</header>

	<section id="main_image">
        메인 이미지 
    </section>
            
    <section id="main">
        <div class="box">    
                메인 내용
        </div> <!-- box -->
    </section>

	<footer>
		<div class="box">
			푸터 내용
		</div> <!-- box -->
	</footer>
</body>
</html>
