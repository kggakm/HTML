<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<input id="userInput" type="text" placeholder="이름 입력">
<button onclick="show()">확인</button>
<p id="result"></p>

<script>
function show() {
    let value = document.getElementById("userInput").value;
    document.getElementById("result").innerText = value + "님 환영합니다!";
}
</script>
</body>
</html>
