<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0;  padding: 0; }	
.box { width: 1000px;	margin: 0 auto; }
.clear { clear: both; }
header { height: 60px;	background-color: #dddddd; }
section#image {	height: 150px;  background-color: yellow; }
aside {	width:200px;  height: 300px;  float:left;  background-color: pink; }
section#content { width:800px;	height: 300px;	float:right;  background-color: green; }
footer { height: 60px;	background-color: #dddddd; }
header, aside, section, footer { text-align: center; } 
</style>
</head>
<body>
	<header>
		상단 헤더
	</header>
	<section id="image">
			메인 이미지
	</section>
	<div class="box">		
		<aside>
			사이드바
		</aside>			
		<section id="content">
			메인 콘텐츠
		</section>
	</div>		
	<div class="clear"></div>
	<footer>
			하단 푸터
	</footer>
</body>
</html>
