<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0;  padding: 0; }	
.box { width: 1000px;  margin: 0 auto; }
header { height: 60px;	background-color: #dddddd; }
section { height: 300px;  background-color: green; }
footer { height: 60px;	background-color: #dddddd; }
header, section, footer { text-align: center; } 	
</style>
</head>
<body>
	<div class="box">
		<header>
			상단 헤더
		</header>
		<section>
			메인 콘텐츠
		</section>
		<footer>
			하단 푸터
		</footer>
	</div> <!-- box -->
</body>
</html>
