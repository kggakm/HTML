<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
div {
	width: 100px;
	height: 60px;
	background-color: orange;
	border: solid 1px black;
}
div.b { 
	position: absolute;
	left: 80px;
	top: 50px;
}
</style>
</head>
<body>
	<h3>절대 위치 지정(position: absolute)</h3>
	<div>요소 A</div>
	<div class="b">요소 B</div> 
	<div>요소 C</div> 
</body>
</html>
