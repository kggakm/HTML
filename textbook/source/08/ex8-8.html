<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* {  margin: 0;  padding: 0;  }
li {  list-style-type: none;  }
#fish { width: 1000px;  margin: 0 auto; }
#fish h2 {  margin: 30px 0; }
#fish ul { 
    width: 310px; height: 350px; 
    float: left; 
    margin-right: 20px; 
    border: solid 1px #cccccc; 
}
#fish img {  
    width: 270px;  
    padding:20px; 
    border-bottom: solid 1px #cccccc; 
}
#fish li:nth-child(2) {
    padding: 10px; 
    font-size: 23px;   
    font-weight: bold;
}
#fish li:nth-child(3) {
	font-size: 16px;
    padding: 0 10px;
    color: blue;
}
#fish li:nth-child(4) { padding: 10px; }
#fish li:nth-child(4) span:first-child {  float: left; color: orange;  }
#fish li:nth-child(4) span:last-child  {  float: right; }
</style>
</head>
<body>
    <div id="fish">
	    <h2>열대어 상품</h2>
		<ul>
		    <li><img src="img/fish1.png"></li>
		    <li>열대어</li>
		    <li>화려한 빛깔의 물고기</li>
		    <li><span>10,000원</span><span>재고 : 3</span></li>
		</ul>

        </ul>	
        <ul>

    </div>
</body>
</html>
