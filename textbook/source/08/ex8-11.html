<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
#parent div {
	width: 100px;
	height: 60px;
	background-color: orange;
	border: solid 1px black;
}
#parent {
	width: 350px;
	height: 200px;
	position: relative;
	border: solid 1px red;
}
#parent .b { 
	position: absolute;
	left: 80px;
	top: 40px;
}
</style>
</head>
<body>
	<h3>절대 위치 지정(position: absolute, 부모 요소가 있는 경우)</h3>
	<div id="parent">
		<div>요소 A</div>
		<div class="b">요소 B</div> 
		<div>요소 C</div> 
	</div>
</body>
</html>
