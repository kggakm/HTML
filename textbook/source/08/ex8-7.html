<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* {	margin: 0;	padding: 0; }
li { list-style-type: none; }
#sitemap {
	height: 250px;
	background-color: purple;
	color: white;
}
#sitemap .box { width: 800px;  margin: 0 auto; /* border: solid 1px red; */ }
#sitemap .menus {
	float: left;
	margin: 50px 40px;
    /* border: solid 1px blue; */
}
#sitemap li {  margin-top: 10px;  }
</style>
</head>
<body>
<div id="sitemap">
	<div class="box">
		<div class="menus">
			<h3>회사 소개</h3>
			<ul>
			<li>인사말</li>
			<li>회사 연혁</li>
			<li>조직도</li>
			<li>찾아오시는 길</li>
			</ul>
		</div>
		<div class="menus">
			<h3>상품 소개</h3>
			<ul>
			<li>상품 1</li>
			<li>상품 2</li>
			<li>상품 3</li>
			<li>상품 4</li>
			</ul>
		</div>
		<div class="menus">
			<h3>고객 센터</h3>
			<ul>
			<li>공지사항</li>
			<li>고객 문의</li>
			<li>자주 묻는 질문</li>
			</ul>
		</div>
		<div class="menus">
			<h3>매장 안내</h3>
			<ul>
			<li>매장 검색</li>
			<li>매장 가입 문의</li>
			<li>매장 지도</li>
			</ul>
		</div>
	</div>	<!-- box -->
</div>	<!-- sitemap -->	
</body>
</html>
