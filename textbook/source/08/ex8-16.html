<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0;  padding: 0; }		
.box {	width: 1000px;	margin: 0 auto; }
header {  height: 60px;  background-color: #dddddd; }
section#image { height: 150px;  background-color: yellow;	}
section#content { height: 300px; background-color: green; }
footer { height: 60px;  background-color: #dddddd;}
header, section, footer {  text-align: center; } 
</style>
</head>
<body>
	<header>
		상단 헤더
	</header>
	<section id="image">
			메인 이미지
	</section>
	<div class="box">			
		<section id="content">
			메인 콘텐츠
		</section>
	</div>		
	<footer>
			하단 푸터
	</footer>
</body>
</html>
