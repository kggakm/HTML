<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: "돋움"; color: #444444; }
h1 { text-decoration: underline; color: green; }
p { line-height: 150%; border: solid 1px green; padding: 20px; }
span { font-weight: bold; color: red; }
</style>
</head>
<body>
	<h1>선택자란?</h1>
    <p>HTML 요소에 스타일을 입히는 대부분의 CSS 코드에서 <span>중괄호의 앞부분</span>에 오는 게 바로 선택자이다.</p>
	<p>선택자는 CSS에서 스타일을 입힐 때 <span>HTML 요소나 영역을 선택</span>하는 데 사용된다.</p>
</body>
</html>
