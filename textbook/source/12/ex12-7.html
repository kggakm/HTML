<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
// 아래 코드는 콘솔에 단순 메시지를 출력합니다.
console.log("안녕하세요! 콘솔 출력 예제입니다.");  // 한 줄 주석 사용

/* 
  여러 줄 주석 예
  - console.log()는 브라우저 개발자 도구의 콘솔에 메시지를 출력합니다.
  - 디버깅(오류 확인)이나 값 확인에 자주 사용됩니다.
*/
</script>
</head>
<body>
<h2>주석문 예제</h2>
<p>브라우저 개발자 도구(F12)의 Console 탭을 열어 메시지를 확인해 보세요.</p>
</body>
</html>
