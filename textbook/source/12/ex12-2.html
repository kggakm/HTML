<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
#msg { 
    font-size: 18px;
    margin-bottom: 10px;
}
button { padding: 10px 20px; background: blue; color: white;
    border: none; border-radius: 6px;
}    
</style>
</head>
<body>
<p id="msg">여기에 표시됩니다.</p>
<button id="btn">눌러 보세요</button>
<script>
document.getElementById('btn').addEventListener('click', function() {
    document.getElementById('msg').textContent = '버튼을 눌렀습니다!';
});
</script>
</body>
</html>
