<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
</head>
<body>
<p id="text">안녕하세요.</p>
<button id="btnColor">글자 색상 변경</button>

<script>
const text = document.getElementById("text");
const btnColor = document.getElementById("btnColor");

btnColor.onclick = function () {
  text.style.color = "blue";
};
</script>
</body>
</html>
