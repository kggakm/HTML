<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
.box { 
    border: 1px solid red;
    width: 80vw;   /* 뷰포트 가로 너비의 80% */
     height: 50vh;  /* 뷰포트 세로 높이의 50% */   
}
</style>
</head> 
<body>
    <h3>뷰포트 기반 박스 (vw / vh)</h3>
    <p>브라우저 창 크기를 좌우로 줄이거나 늘려 보세요.</p>
    <div class="box">
        width: 80vw;<br>
        height: 50vh;<br><br>
        브라우저 창의 가로·세로 크기에 따라<br>
        박스 크기가 함께 커졌다가 작아집니다.
    </div>
</body>
</html>
