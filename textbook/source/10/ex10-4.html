<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
p { font-size: 18px; }
img {
    width: 100%;        /* 가로 너비를 부모 요소에 맞춤 */
    max-width: 400px;   /* 기본 최대 너비 */
    margin: 0 auto;     /* 중앙 정렬 */
}
/* 480px 이하: 글자 크기 줄이기 */
@media (max-width: 640px) {
    p { font-size: 14px; }
    img { max-width: 250px; }
}
</style>
</head>
<body>
    <h3>모바일에서 텍스트와 이미지 크기 줄이기</h3>
    <p>
        데스크톱 화면에서는 텍스트18px, 이미지는 100% 크기로 보입니다.<br>
        브라우저 가로 폭을 640px 이하로 줄이면 글자 크기가 14px로 작아지고
        이미지도 250px로 작아 집니다.
    </p>
    <img src="img/fruit.jpg">
</body>
</html>
