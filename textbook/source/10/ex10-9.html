<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }    
.wrap {
    display: flex;
    flex-direction: row;
    gap: 16px;
    padding: 10px;
}
.box {
    flex: 1;
    padding: 20px;
    background: #eee;
}

@media (max-width: 640px) {
    .wrap {
      flex-direction: column; /* 좁은 화면에서는 세로 배치 */
    }
}
</style>
</head>
<body>
    <div class="wrap">
        <div class="box">박스 A</div>
        <div class="box">박스 B</div>
        <div class="box">박스 C</div>
    </div>
</body>
</html>
