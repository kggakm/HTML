<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }    
.container {
    display: flex;
    padding: 10px;
}
.layout1 { justify-content: flex-start; }
.layout2 { justify-content: flex-end; }
.layout3 { justify-content: center; }
.layout4 { justify-content: space-between; }
.layout5 { justify-content: space-around; }
.layout6 { justify-content: space-evenly; }
.item { border: solid 1px #000; padding: 10px 20px; }
</style>
</head>
<body>
    <h2 style="text-align: center; padding: 20px;">justify-content 속성과 속성 값</h2>
    <div class="container layout1">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>    
    <div class="container layout2">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>   
    <div class="container layout3">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>  
    <div class="container layout4">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>  
    <div class="container layout5">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>        
    <div class="container layout6">
        <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    </div>                   
</body>
</html>
