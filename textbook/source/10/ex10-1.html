<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
.parent {border: 1px solid red; font-size: 20px; } /* 부모 글자 크기가 20px */
.em-text { font-size: 2em; } /* 부모 font-size의 2배 */
.rem-text { font-size: 2rem; } /* 기본 font-size(16px)의 2배 ⇒ 항상 32px */  
</style>
</head>
<body>
  <div class="parent">
    <h2>부모 요소(.parent)의 font-size를 20px로 키운 경우</h2>
    <p class="em-text">이 문장은 <strong>2em</strong> 입니다.</p>
    <p class="rem-text">이 문장은 <strong>2rem</strong> 입니다.</p>
  </div>
</body>
</html>
