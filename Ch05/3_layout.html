<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3_layout</title>
    <style>
        /* 초기화 */
        * {
            margin: 0;
            padding: 0;
            font: normal 12px '돋움';
        }

        ul, ol { list-style: none; }
        a { text-decoration: none; color: #111;}
        input, textarea { outline: none; }

        /* container */
        #container {
            width: 800px;
            height: auto;
            padding: 10px;
            background: #fff;
            border: 1px solid black;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* header */
        header {
            width: 100%;
            height: 120px;
            padding: 10px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
        }

        /* main */
        main {
            width: 100%;
            height: auto;
            margin: 10px 0;
            padding: 10px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
        }

        main > section {
            width: 100%;
            height: auto;
            padding: 10px;
            background: #ddd;
            border: 1px dashed black;
            box-sizing: border-box;
        }
        
        main > section:nth-child(2) {
            margin-top: 10px;
        }

        main > section > article {
            width: 100%;
            height: 200px;
            padding: 10px;
            background: #ccc;
            border:1px dashed black;
            box-sizing: border-box;
        }

        main > section > article:nth-child(2) {
            margin-top: 10px;
        }

        /* footer */
        footer {
            width: 100%;
            height: 100px;
            padding: 10px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box; 
        }

    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            main
            <section>
                section #1
                <article>article #1</article>
                <article>article #2</article>
            </section>
            <section>
                section #2
                <article>article #1</article>
                <article>article #2</article>
            </section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
